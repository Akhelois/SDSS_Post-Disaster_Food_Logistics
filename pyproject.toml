[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdss-logistik-bencana"
version = "1.0.0"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["backend*"]
exclude = ["api*", "frontend*"]

[tool.vercel]
entrypoint = "api/main.py"